name: Bug report
description: Report a reproducible problem in AllianceLab.
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Use fictional data. Do not attach private scouting backups.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, device, and app version
